site_name: pyNLC
site_url: https://nolimitconnect.org
site_description: pyNLC project overview and links.
site_author: pyNLC Project

theme:
  name: material
  palette:
    # Optional: Gives your site a nice clean dark/light mode toggle
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

docs_dir: docs

nav:
  - Home: index.md
  - Migration Roadmap: migration.md
  - Code Reference: reference.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          setup_commands:
            - import sys
            - sys.path.append(".")
